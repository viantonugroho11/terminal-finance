services:
  finance-mcp:
    build:
      context: ../finance-mcp
    container_name: finance-mcp
    restart: unless-stopped
    ports:
      - "7800:7800"
    volumes:
      - ${HERMES_DATA:-~/.hermes}/finance:/opt/data/finance
    environment:
      FINANCE_DB: /opt/data/finance/finance.db
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7800/mcp', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      - finance-mcp
    volumes:
      - ${HERMES_DATA:-~/.hermes}:/opt/data
      - ../finance-skills:/opt/data/skills:ro
    ports:
      - "8642:8642"   # OpenAI-compatible API
      - "9119:9119"   # Dashboard
    environment:
      HERMES_DASHBOARD: "1"
    networks:
      - hermes-net
    command: ["gateway", "run"]

networks:
  hermes-net:
    driver: bridge
