name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: finance-mcp

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the image runs.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # The suite is offline by design — providers are exercised through
      # injected fetchers and the mock provider, never the live upstreams.
      - run: pytest

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches Dockerfile / pyproject drift, which no unit test can see.
      - uses: docker/build-push-action@v6
        with:
          context: finance-mcp
          push: false
