# Hermes config for Finance Terminal.
# Copy to ~/.hermes/config.yaml (or mount as /opt/data/config.yaml in the hermes container).
# Full reference: https://hermes-agent.nousresearch.com/docs/reference/mcp-config-reference

# ── LLM ─────────────────────────────────────────────────────────────
# Current: DeepSeek (OpenAI-compatible). Configurable — to swap:
#   1. Change `default` (model name) + `base_url` below
#   2. Set matching api key in .env (compose aliases DEEPSEEK_API_KEY → OPENAI_API_KEY)
# Examples:
#   OpenRouter: default=openai/gpt-4o, base_url=https://openrouter.ai/api/v1, key=OPENROUTER_API_KEY→OPENAI_API_KEY
#   Anthropic:  provider=anthropic, default=claude-3-5-sonnet-latest, key=ANTHROPIC_API_KEY
model:
  default: deepseek-chat
  provider: custom
  base_url: https://api.deepseek.com/v1
  temperature: 0.3
  top_p: 0.9

mcp_servers:
  finance:
    # Streamable-HTTP MCP transport. In compose, hermes reaches finance-mcp
    # by service name on the shared bridge network.
    url: "http://finance-mcp:7800/mcp"
    enabled: true
    timeout: 60
    connect_timeout: 15
    # Whitelist — keep the tool surface tight so Hermes picks them reliably.
    tools:
      include:
        - get_quote
        - get_historical_prices
        - get_history                 # alias
        - get_company_profile
        - get_company                 # alias
        - get_fundamentals
        - get_financials              # alias
        - get_financial_statements
        - get_dividends
        - get_corporate_actions
        - get_sector_info
        - get_macro
        - get_foreign_flow
        - search_stocks
        - get_broker_activity
        - get_order_book
        - get_ipo_calendar
        - get_trading_calendar
        - get_disclosures
        - get_board
        - get_shareholders
        - get_subsidiaries
        - get_idx_overview
        - get_idx_movers
        - valuation_dcf
        - valuation_sensitivity
        - valuation_implied_growth
        - evaluate_report
        - get_sec_filings
        - get_sec_facts
        - get_technical
        - get_market_overview
        - get_market_movers
        - search_news
        - cache_stats
        - resolve_symbol_tool
        - portfolio_add_transaction
        - portfolio_holdings
        - portfolio_summary
        - portfolio_allocation
        - portfolio_risk
        - watchlist_create
        - watchlist_add
        - watchlist_remove
        - watchlist_list
        - watchlist_quotes
        # watch engine (ADR-0023)
        - watch_add
        - watch_list
        - watch_pause
        - watch_resume
        - watch_delete
        - watch_evaluate_once
        - morning_digest
        # backtest engine (ADR-0029)
        - list_strategies
        - submit_backtest
        - get_backtest_status
        - get_backtest_result
        # portfolio lots + tax + rebalance (ADR-0027)
        - record_trade
        - list_lots
        - get_unrealized_pnl
        - get_realized_pnl
        - rebalance_plan
        # flow deep-dive (ADR-0026)
        - get_insider_trades
        - get_major_holder_changes
        - get_broker_flow_aggregate
        - get_ownership_breakdown
        # news + sentiment (ADR-0028)
        - news_ingest_once
        - news_score_missing
        - get_news
        - news_sentiment
      resources: false

# Cron jobs — evaluate watches every minute in WIB market hours;
# hourly off-hours. Digest fires 07:30 WIB on weekdays. Ingest RSS
# every 15 minutes; score sentiment every 20 minutes.
cron_jobs:
  - name: watch_evaluate_mkt
    schedule: "*/1 2-9 * * 1-5"    # 09:00-16:00 WIB (UTC+7)
    command: "hermes tool call finance.watch_evaluate_once"
  - name: watch_evaluate_offhours
    schedule: "*/15 * * * *"
    command: "hermes tool call finance.watch_evaluate_once"
  - name: morning_digest
    schedule: "30 0 * * 1-5"        # 07:30 WIB = 00:30 UTC
    command: "hermes skill run morning-digest"
  - name: news_ingest
    schedule: "*/15 * * * *"
    command: "hermes tool call finance.news_ingest_once"
  - name: news_score
    schedule: "*/20 * * * *"
    command: "hermes tool call finance.news_score_missing limit=50"

# Skills live at /opt/data/skills — mounted from ../finance-skills in compose.
# Hermes auto-discovers per its Skills System.

