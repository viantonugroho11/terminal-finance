services:
  finance-mcp:
    build:
      context: ../finance-mcp
    container_name: finance-mcp
    restart: unless-stopped
    ports:
      - "7800:7800"
    volumes:
      - ${HERMES_DATA:-~/.hermes}/finance:/opt/data/finance
      - ../config/finance.routing.yaml:/opt/data/config/finance.routing.yaml:ro
      # Optional OJK SPI snapshot — operator mirrors from data.ojk.go.id/SJKPublic.
      # - ${HERMES_DATA:-~/.hermes}/ojk_spi.json:/opt/data/ojk_spi.json:ro
    environment:
      FINANCE_DB: /opt/data/finance/finance.db
      # Provider toggles — set to "off" to disable one provider without
      # touching code or restarting anything else.
      FINANCE_IDX: ${FINANCE_IDX:-on}
      FINANCE_BI:  ${FINANCE_BI:-on}
      FINANCE_BPS: ${FINANCE_BPS:-on}
      FINANCE_OJK: ${FINANCE_OJK:-on}
      FINANCE_SEC: ${FINANCE_SEC:-on}
      # Credentials — read from .env or shell. Never committed.
      FINANCE_BPS_API_KEY: ${FINANCE_BPS_API_KEY:-}
      FINANCE_SEC_USER_AGENT: ${FINANCE_SEC_USER_AGENT:-}
      FINANCE_OJK_SPI_PATH: ${FINANCE_OJK_SPI_PATH:-}
      # Router config path (defaults to bundled YAML).
      FINANCE_ROUTING_CONFIG: /opt/data/config/finance.routing.yaml
    networks:
      - hermes-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7800/mcp', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    depends_on:
      - finance-mcp
    volumes:
      - ${HERMES_DATA:-~/.hermes}:/opt/data
      - ../finance-skills:/opt/data/skills:ro
      - ../config/hermes.config.yaml:/opt/data/config.yaml:ro
    ports:
      - "8642:8642"   # OpenAI-compatible API
      - "9119:9119"   # Dashboard
    environment:
      HERMES_DASHBOARD: "1"
      # Hermes `provider: custom` reads OPENAI_API_KEY. For DeepSeek default
      # we alias DEEPSEEK_API_KEY into it. To swap provider: set the matching
      # env below and edit config/hermes.config.yaml (base_url + default).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${DEEPSEEK_API_KEY:-}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Native Telegram gateway — Hermes handles chat + routes to MCP tools.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
    networks:
      - hermes-net
    command: ["gateway", "run"]

networks:
  hermes-net:
    driver: bridge
