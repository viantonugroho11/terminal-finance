[project]
name = "finance-mcp"
version = "0.3.0"
description = "Finance MCP server for Hermes Agent"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Novianto Nugroho" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Everything needed to run the test suite and the linters. Kept out of the
# runtime deps so the Docker image stays slim.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default: no test may reach the network. Providers are exercised
# through injected fetchers / the mock provider.
addopts = "-q --strict-markers"
# Matched by message, not by class: the class lives in urllib3, which is a
# transitive dep and must not become an import-time requirement of pytest.
filterwarnings = [
    "ignore:.*urllib3 v2 only supports OpenSSL.*:Warning",
]

[tool.ruff]
# Match the oldest interpreter the test suite runs on (see ADR-0006): the
# FastMCP shim lets tests run on 3.9, so lint rules must not assume 3.11+
# runtime syntax. Runtime targets 3.12 (Dockerfile).
target-version = "py39"
line-length = 100
src = ["finance_mcp", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes — catches the dead-import class of bug that broke
            # tests/test_telegram.py silently for a whole release
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
]
ignore = [
    "E501",  # line length handled by the formatter, not the linter
    "B008",  # FastMCP tool signatures legitimately call in defaults
    # The next four fight the house style rather than catching defects. This
    # codebase deliberately uses compact one-liners for guard clauses and
    # short accessors, and `l` for a portfolio lot. Enforcing them would mean
    # reformatting ~35 sites for no correctness gain.
    "E701",  # `if x: return` on one line
    "E702",  # `a = 1; b = 2`
    "E731",  # `f = lambda ...`
    "E741",  # ambiguous name `l`
]

[tool.ruff.lint.per-file-ignores]
# Test doubles deliberately shadow builtins and keep unused signature args.
"tests/*" = ["B011"]
