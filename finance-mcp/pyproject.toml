[project]
name = "finance-mcp"
version = "0.1.0"
description = "Finance MCP server for Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "yfinance>=0.2.50",
    "pandas>=2.2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_mcp"]
